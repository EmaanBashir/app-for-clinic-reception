<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>EyeMed Clinic</title>

  <link rel="stylesheet" type="text/css" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

  <style>
    .img {
      background-size: cover;
      background-position: center center;
    }

    /* Clean up the date input controls */
    input[type="date"] {
      position: relative;
    }

    input[type="date"]::-webkit-inner-spin-button,
    input[type="date"]::-webkit-clear-button {
      display: none;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.7;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Form sections */
    .form-section-title {
      font-size: 1rem;
      font-weight: 600;
      color: #495057;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 8px;
      margin-bottom: 18px;
    }

    /* Make the card slightly less bulky */
    .clinic-card {
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body class="img js-fullheight" style="background-image: url(images/bg.jfif);">

  <div class="container card mt-4 p-4 clinic-card">

    <!-- Top navigation -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="./list.html" class="btn btn-outline-secondary btn-sm">
        Patients List
      </a>

      <a href="./login.html" class="btn btn-outline-danger btn-sm">
        SIGN OUT
      </a>
    </div>

    <!-- Page title -->
    <h2 class="text-center mb-4">Payment Receipt</h2>

    <form id="receipt">

      <!-- Patient details -->
      <div class="form-section-title">
        Patient Information
      </div>

      <div class="row g-3">

        <div class="col-md-6">
          <label for="patientId" class="form-label">MR No.</label>
          <input
            type="number"
            class="form-control"
            id="patientId"
            min="1"
            required
            disabled>
        </div>

        <div class="col-md-6 d-flex align-items-end">
          <div class="form-check mb-2">
            <input
              class="form-check-input"
              type="checkbox"
              id="old">

            <label class="form-check-label" for="old">
              Old patient
            </label>
          </div>
        </div>

        <div class="col-md-4">
          <label for="patientName" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="patientName"
            required>
        </div>

        <div class="col-md-4">
          <label for="patientDOB" class="form-label">Date of Birth</label>
          <input
            type="date"
            class="form-control"
            id="patientDOB"
            required>
        </div>

        <div class="col-md-4">
          <label for="patientGender" class="form-label">Gender</label>
          <select
            class="form-select"
            id="patientGender"
            required>
            <option value="m">Male</option>
            <option value="f">Female</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="patientPhone" class="form-label">Phone</label>
          <input
            type="number"
            class="form-control"
            id="patientPhone">
        </div>

        <div class="col-md-6">
          <label for="patientAddress" class="form-label">Address</label>
          <input
            type="text"
            class="form-control"
            id="patientAddress">
        </div>

      </div>

      <!-- Consultation details -->
      <div class="form-section-title mt-4">
        Consultation
      </div>

      <div class="row g-3">

        <div class="col-md-6">
          <label for="consultant" class="form-label">Consultant</label>

          <select
            id="consultant"
            class="form-select"
            required>
            <option value="0">Dr. Hamid Bashir</option>
            <option value="1">Dr. Naeem Altaf</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="fee" class="form-label">Consultation Fee</label>
          <input
            type="number"
            class="form-control"
            id="fee"
            required>
        </div>

      </div>

      <!-- Form actions -->
      <div class="d-flex justify-content-between align-items-end mt-4 pt-3 border-top">

        <div class="d-flex align-items-center">
          <label for="receptionist" class="form-label mb-0 me-2">
            Entered By:
          </label>

          <input
            type="text"
            class="form-control"
            id="receptionist"
            style="width: 220px;"
            required>
        </div>

        <button
          type="submit"
          class="btn btn-secondary px-4">
          Save / Print
        </button>

      </div>

    </form>

  </div>

  <script src="./js/jquery.min.js"></script>
  <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/savePrint.js"></script>
  <script src="./js/next.js"></script>

  <script>
    let receptionistField = document.querySelector("#receptionist");

    let receptionistName = sessionStorage.getItem("receptionistName");

    if (receptionistName) {
      receptionistField.value = receptionistName;
    }
  </script>

</body>

</html>
