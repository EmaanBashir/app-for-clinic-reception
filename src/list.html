<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EyeMed Clinic</title>

    <link rel="stylesheet" type="text/css"
        href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <style>
        /* =========================
           SCREEN
           ========================= */

        body {
            background-color: #f5f5f5;
        }

        .img {
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
        }

        .list-card {
            margin-top: 40px;
            margin-bottom: 40px;
            padding: 35px;
        }

        .page-title {
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .filter-row {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
        }

        th {
            white-space: nowrap;
        }

        td {
            vertical-align: middle;
        }

        .table-container {
            width: 100%;
        }

        .total-fee {
            margin-top: 10px;
            font-size: 15px;
            font-weight: bold;
        }


        /* =========================
           PRINT
           ========================= */

        @media print {

            @page {
                size: A4 landscape;
                margin: 8mm;
            }

            html,
            body {
                width: 100%;
                margin: 0;
                padding: 0;
                background: white !important;
            }

            body {
                font-family: Arial, sans-serif;
                font-size: 9px;
                color: #000;
            }

            /* Remove screen styling */
            .list-card {
                width: 100%;
                max-width: none;
                margin: 0;
                padding: 0;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
            }

            /* Hide navigation and filters */
            #backBtn,
            #printBtn,
            .filter-row {
                display: none !important;
            }

            /* Compact heading */
            .page-title {
                font-size: 15px;
                margin: 0 0 6px 0;
                text-align: center;
            }

            #currentMonth {
                font-size: 11px;
                margin: 0 0 5px 0 !important;
                text-align: center;
            }

            .table-container {
                width: 100%;
                margin: 0;
                padding: 0;
                overflow: visible !important;
            }

            .table-responsive-xxl {
                overflow: visible !important;
            }

            table {
                width: 100% !important;
                margin: 0 !important;
                border-collapse: collapse !important;
                table-layout: fixed;
                font-size: 8.5px;
            }

            /* Compact table cells */
            table th,
            table td {
                padding: 3px 4px !important;
                line-height: 1.15;
                border: 1px solid #999 !important;
                vertical-align: middle;
            }

            table thead {
                display: table-header-group;
            }

            table tbody tr {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            table th {
                font-weight: bold;
                white-space: nowrap;
                background: #eee !important;
            }

            /* Column widths */
            table th:nth-child(1),
            table td:nth-child(1) {
                width: 7%;
            }

            table th:nth-child(2),
            table td:nth-child(2) {
                width: 16%;
            }

            table th:nth-child(3),
            table td:nth-child(3) {
                width: 10%;
            }

            table th:nth-child(4),
            table td:nth-child(4) {
                width: 8%;
            }

            table th:nth-child(5),
            table td:nth-child(5) {
                width: 16%;
            }

            table th:nth-child(6),
            table td:nth-child(6) {
                width: 12%;
            }

            table th:nth-child(7),
            table td:nth-child(7) {
                width: 21%;
            }

            table th:nth-child(8),
            table td:nth-child(8) {
                width: 10%;
            }

            /* Keep long values from creating tall rows */
            table td {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .total-fee {
                font-size: 10px;
                margin-top: 5px;
            }
        }
    </style>
</head>


<body class="img js-fullheight"
    style="background-image: url(images/bg.jfif);">

    <div class="container-lg card list-card">

        <!-- Back button -->
        <div class="text-start">
            <a id="backBtn"
                href="./index.html"
                class="btn">
                BACK
            </a>
        </div>


        <!-- Page title -->
        <h2 class="text-center page-title">
            Patients List
        </h2>


        <!-- Filters -->
        <div class="row filter-row">

            <div class="col-lg-4 col-md-5 col-10">

                <label for="consultant"
                    class="form-label">
                    <strong>Consultant</strong>
                </label>

                <select id="consultant"
                    class="form-select"
                    required>

                    <option value="0">
                        Dr. Hamid Bashir
                    </option>

                    <option value="1">
                        Dr. Naeem Altaf
                    </option>

                </select>

            </div>


            <div class="col-lg-4 col-md-4 col-10">

                <label for="month"
                    class="form-label">
                    <strong>Month</strong>
                </label>

                <input id="month"
                    class="form-control"
                    type="month">

            </div>


            <div class="col-lg-4 col-md-3 col-2 text-end">

                <br>

                <button type="button"
                    class="btn btn-secondary"
                    id="printBtn">
                    PRINT
                </button>

            </div>

        </div>


        <!-- Table -->
        <div class="table-container">

            <h4 id="currentMonth"
                class="mt-3">
            </h4>

            <div class="table-responsive-xxl">

                <table class="table table-hover">

                    <thead id="thead1">

                        <tr>
                            <th>MR No.</th>
                            <th>Name</th>
                            <th>Date of Birth</th>
                            <th>Gender</th>
                            <th>Date / Time</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Consultation Fee</th>
                        </tr>

                    </thead>

                    <tbody id="tbody1">
                    </tbody>

                </table>

            </div>


            <div class="total-fee">
                Total Fee:
                <span id="total1"></span>
            </div>

        </div>

    </div>


    <script src="./js/jquery.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/list.js"></script>

</body>

</html>
